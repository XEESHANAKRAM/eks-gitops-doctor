rules:
  braces:
    max-spaces-inside: 1
    level: error
  brackets:
    max-spaces-inside: 1
    level: error
  colons:
    max-spaces-after: 1
    level: error
  commas:
    max-spaces-after: 1
    level: error
  comments:
    min-spaces-from-content: 1
    level: error
  document-start: disable
  empty-lines:
    max: 2
    level: error
  indentation:
    spaces: 2
    level: error
  key-duplicates: enable
  line-length:
    max: 140
    level: warning
  new-line-at-end-of-file: enable
  trailing-spaces: enable
  truthy: disable
